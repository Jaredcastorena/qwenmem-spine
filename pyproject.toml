[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwenmem-spine"
version = "0.1.0"
description = "Experimental exact triangle navigation compiled into Qwen3.5 layers"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["torch==2.14.1", "numpy>=1.26", "safetensors>=0.8.0", "transformers==5.19.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
triangle-memory = "triangle_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

